<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <title>Kiro Chat</title>
    <link rel="stylesheet" href="{{stylesUri}}">
</head>

<body>
    <div id="chat-root">
        <div id="header" class="header">
            <select id="model-selector" class="model-selector" title="Model (loaded from kiro-cli)" disabled>
                <option value="">Loading models…</option>
            </select>
            <select id="mode-selector" class="model-selector hidden" title="Agent (e.g. kiro_default, kiro_planner)"></select>
            <div id="context-usage" class="context-usage" title="Context usage: 0%">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <circle cx="9" cy="9" r="7" fill="none" stroke="var(--vscode-editorWidget-border, #555)"
                        stroke-width="2" />
                    <circle id="context-ring" cx="9" cy="9" r="7" fill="none" stroke="#73c991" stroke-width="2"
                        stroke-dasharray="0 44" stroke-dashoffset="11" stroke-linecap="round"
                        transform="rotate(-90 9 9)" />
                </svg>
                <div id="context-tooltip" class="context-tooltip">
                    <div class="context-tooltip-total">Context used: <span id="ctx-total">0</span>%</div>
                </div>
            </div>
            <div class="header-spacer"></div>
            <button id="start-spec-btn" class="header-icon-btn" title="Plan a feature (Spec): Kiro writes requirements, a design and a task list for you to review">📋</button>
            <button id="clear-chat-btn" class="clear-chat-btn" title="Clear chat and start a new session">🗑</button>
        </div>
        <button id="cwd-indicator" class="cwd-indicator" type="button"
            title="Directory kiro-cli runs in. Click to change." aria-label="kiro-cli working directory">
            <span id="cwd-status" class="cwd-status" aria-hidden="true"></span>
            <span class="cwd-icon" aria-hidden="true">📁</span>
            <span id="cwd-path" class="cwd-path">Resolving working directory…</span>
            <span id="cwd-change" class="cwd-change">Change</span>
        </button>
        <div id="messages" class="messages"></div>
        <div id="loading-indicator" class="loading-indicator hidden">
            <span class="loading-text">⏳ Thinking</span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        </div>
        <div id="spec-phase-bar" class="spec-phase-bar hidden"></div>
        <div id="queued-messages" class="queued-messages hidden" aria-live="polite" aria-label="Queued messages"></div>
        <div class="input-area">
            <textarea id="message-input" class="message-input" aria-label="Message Kiro" rows="1"></textarea>
            <button id="stop-btn" class="stop-btn hidden" type="button" title="Stop Kiro (Esc)" aria-label="Stop Kiro">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
                    <rect x="1" y="1" width="10" height="10" rx="1.5" />
                </svg>
            </button>
            <button id="send-btn" class="send-btn" title="Send message">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M1 1.5L15 8L1 14.5V9.5L10 8L1 6.5V1.5Z" />
                </svg>
            </button>
        </div>
    </div>
    <script nonce="{{nonce}}" src="{{markdownUri}}"></script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>

</html>
