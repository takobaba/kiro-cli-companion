<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Kiro CLI Companion: a chat bubble containing a terminal prompt (>_) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Chat bubble with tail (bottom-left) -->
  <path fill="url(#bubble)"
        d="M78 56 H178 A30 30 0 0 1 208 86 V148 A30 30 0 0 1 178 178 H116 L74 210 L82 178 H78 A30 30 0 0 1 48 148 V86 A30 30 0 0 1 78 56 Z"/>

  <!-- Terminal prompt: chevron + cursor -->
  <polyline points="86,94 116,117 86,140" fill="none" stroke="url(#prompt)"
            stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="128" width="50" height="14" rx="7" fill="url(#prompt)"/>
</svg>
